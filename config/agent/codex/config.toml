# Stable Codex user defaults that are safe to keep in dotfiles.
# Do not add runtime state such as [projects] or [hooks.state] here.

web_search = "live"
model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "workspace-tool-caches"

# Permission profiles do not compose with legacy sandbox_mode settings. This
# profile extends the built-in workspace filesystem policy with local tool
# cache roots and scoped GitHub network access for CLI inspection commands.
[permissions.workspace-tool-caches]
description = "Workspace access plus writable mise, uv, and Bun caches."
extends = ":workspace"

[permissions.workspace-tool-caches.workspace_roots]
"~/Library/Caches/mise" = true
"~/.cache/uv" = true
"~/.bun/install/cache" = true
"~/Library/Caches/bun" = true

[permissions.workspace-tool-caches.network]
enabled = true

[permissions.workspace-tool-caches.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"

# Profile domain rules require the sandboxed-command network proxy.
[features.network_proxy]
enabled = true

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "project-name",
    "branch-changes",
    "run-state",
    "approval-mode",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit",
    "task-progress",
]
status_line_use_colors = true
